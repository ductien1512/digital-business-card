<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Digital Business Card</title>
    <script src="assets/tailwindcss.js"></script>
    <link rel="stylesheet" href="assets/fontawesome.min.css">
    <link rel="stylesheet" href="assets/inter.css">
    <!-- Firebase SDK -->
    <script src="assets/firebase-app-compat.js"></script>
    <script src="assets/firebase-database-compat.js"></script>
    <script src="assets/firebase-auth-compat.js"></script>
    <style>
        :root { --admin-primary: #2563eb; --admin-secondary: #7c3aed; }
        body.theme-creative { --admin-primary: #db2777; --admin-secondary: #f97316; }
        body.theme-ocean { --admin-primary: #0891b2; --admin-secondary: #2563eb; }
        body {

            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #d1d5db 100%);
            min-height: 100vh;
            padding-bottom: 24px;
        }
        *, *::before, *::after { box-sizing: border-box; }
        .container {
            width: min(100%, 640px);
            margin: 0 auto;
            padding: 20px 16px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-top: 40px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            background: #ffffff;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(to right, var(--admin-primary), var(--admin-secondary));
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-danger {
            background: #ef4444;
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        .btn-danger:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
            width: 100%;
        }
        .btn-secondary:hover {
            opacity: 0.9;
        }
        .action-buttons {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(110px, .42fr);
            gap: 10px;
            margin-top: 22px;
        }
        .action-buttons .btn { width: 100%; margin: 0; }
        .btn-danger {
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }
        .btn-danger:hover { background: #ffe4e6; }
        .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .file-picker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 46px;
            padding: 11px 14px;
            border: 1px dashed #93c5fd;
            border-radius: 12px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s ease, border-color .2s ease, transform .2s ease;
        }
        .file-picker:hover { background: #dbeafe; border-color: var(--admin-primary); }
        .file-picker:active { transform: scale(.99); }
        .auth-form {
            display: block;
        }
        .admin-panel {
            display: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .success-message {
            background: #ecfdf5;
            color: #059669;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 8px;
        }
        .header p {
            color: #6b7280;
            font-size: 14px;
        }
        .profile-preview {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding: 14px 16px;
            background: #f9fafb;
            border-radius: 12px;
        }
        .profile-preview img {
            flex: 0 0 76px;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0;
            border: 3px solid white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .profile-preview > i {
            flex: 0 0 76px;
            width: 76px;
            text-align: center;
        }
        .preview-details { min-width: 0; text-align: left; }
        .profile-preview p {
            color: #6b7280;
            font-size: 14px;
            margin: 3px 0 0;
            overflow-wrap: anywhere;
        }
        .profile-preview #previewName { color: #1f2937; font-size: 16px; font-weight: 700; margin-top: 0; }
        .profile-preview #previewPhone { color: #9ca3af; font-size: 13px; }
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            flex: 0 0 auto;
            min-width: 96px;
            padding: 11px 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            white-space: nowrap;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: var(--admin-primary);
            border-bottom-color: var(--admin-primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .theme-options { display: grid; gap: 12px; }
        .theme-option { display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; cursor: pointer; transition: all .2s ease; }
        .theme-option:hover, .theme-option.selected { border-color: var(--admin-primary); background: #f8fafc; }
        .theme-swatch { width: 42px; height: 42px; border-radius: 10px; flex: 0 0 auto; }
        .theme-swatch.professional { background: linear-gradient(135deg, #111827, #ffffff); }
        .theme-swatch.creative { background: linear-gradient(135deg, #db2777, #f97316); }
        .theme-swatch.ocean { background: linear-gradient(135deg, #0891b2, #2563eb); }

        /* Mobile layout: compact preview and one-row horizontally scrollable navigation. */
        @media (max-width: 640px) {
            body { overflow-x: hidden; }
            .container { width: 100%; padding: 10px 10px 20px; }
            .card { width: 100%; padding: 20px 14px; margin-top: 12px; border-radius: 14px; }
            .header { margin-bottom: 22px; }
            .header h1 { font-size: clamp(22px, 7vw, 28px); line-height: 1.25; }
            .profile-preview { gap: 12px; margin-bottom: 18px; padding: 12px; }
            .profile-preview img,
            .profile-preview > i { flex-basis: 64px; width: 64px; height: 64px; }
            .profile-preview > i { font-size: 34px !important; line-height: 64px; }
            .profile-preview #previewName { font-size: 15px; }
            .profile-preview #previewPhone { font-size: 12px; }
            .tabs { margin: 0 -4px 18px; padding: 0 4px 2px; }
            .tab-btn {
                min-width: 92px;
                min-height: 44px;
                padding: 9px 10px;
                font-size: 12px;
                border-bottom-width: 3px;
            }
            .tab-btn i { margin-right: 4px !important; }
            .theme-option { min-width: 0; padding: 12px 10px; }
            .theme-option > span:last-child { min-width: 0; overflow-wrap: anywhere; }
            .form-input { max-width: 100%; }
            .form-group { margin-bottom: 16px; }
            .action-buttons { grid-template-columns: 1fr 108px; gap: 8px; margin-top: 18px; }
            .action-buttons .btn { padding: 11px 8px; font-size: 13px; }
        }

        @media (min-width: 641px) {
            .action-buttons { position: sticky; bottom: 16px; z-index: 5; padding-top: 12px; background: rgba(255, 255, 255, .94); }
        }

    </style>
</head>
<body>
    <div class="container">
        <div id="firebaseConfigError" class="error-message" style="display: none;"></div>
        <!-- Login Form -->
        <div id="authForm" class="card auth-form">
            <div class="header">
                <h1><i class="fas fa-lock mr-2"></i>Đăng nhập Admin</h1>
                <p>Quản lý thông tin danh thiếp của bạn</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-input" placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="••••••••">
            </div>

            <button onclick="login()" class="btn btn-primary">
                <i class="fas fa-sign-in-alt mr-2"></i>Đăng nhập
            </button>

            <div style="text-align: center; margin-top: 20px; color: #6b7280; font-size: 14px;">
                <p>Chưa có tài khoản? <a href="#" onclick="showSignup()" style="color: #2563eb; text-decoration: none;">Đăng ký tại đây</a></p>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" class="card" style="display: none;">
            <div class="header">
                <h1><i class="fas fa-user-plus mr-2"></i>Tạo tài khoản Admin</h1>
                <p>Đăng ký để quản lý danh thiếp</p>
            </div>

            <div id="signupError" class="error-message"></div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="signupEmail" class="form-input" placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu (tối thiểu 6 ký tự)</label>
                <input type="password" id="signupPassword" class="form-input" placeholder="••••••••">
            </div>

            <button onclick="signup()" class="btn btn-primary">
                <i class="fas fa-user-plus mr-2"></i>Đăng ký
            </button>

            <button onclick="showLogin()" class="btn btn-secondary" style="margin-top: 10px;">
                <i class="fas fa-arrow-left mr-2"></i>Quay lại Đăng nhập
            </button>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="card admin-panel">
            <div class="header">
                <h1><i class="fas fa-cog mr-2"></i>Quản lý Danh thiếp</h1>
                <p id="userEmail" style="color: #2563eb; font-weight: 600;"></p>
            </div>

            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle mr-2"></i>Cập nhật thành công!
            </div>

            <div id="adminError" class="error-message"></div>

            <!-- Profile Preview -->
            <div class="profile-preview">
                <img id="previewImg" src="" alt="Ảnh đại diện xem trước" loading="lazy" decoding="async" style="display: none;">
                <i id="previewIcon" class="fas fa-user" style="font-size: 48px; color: #d1d5db;"></i>
                <div class="preview-details">
                    <p id="previewName">Tên của bạn</p>
                    <p id="previewPhone"></p>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('personal')">
                    <i class="fas fa-user mr-2"></i>Thông tin
                </button>
                <button class="tab-btn" onclick="switchTab('social')">
                    <i class="fas fa-share-alt mr-2"></i>Mạng xã hội
                </button>
                <button class="tab-btn" onclick="switchTab('image')">
                    <i class="fas fa-image mr-2"></i>Ảnh đại diện
                </button>
                <button class="tab-btn" onclick="switchTab('theme')">
                    <i class="fas fa-palette mr-2"></i>Giao diện
                </button>
            </div>

            <!-- Tab: Personal Info -->
            <div id="personalTab" class="tab-content active">
                <div class="form-group">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" id="fullName" class="form-input" placeholder="Trần Đức Tiền">
                </div>

                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input type="tel" id="phone" class="form-input" placeholder="+84396558306">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="hierductien@gmail.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Tên Zalo</label>
                    <input type="text" id="zaloName" class="form-input" placeholder="Trần Đức Tiền">
                </div>
            </div>

            <!-- Tab: Social Links -->
            <div id="socialTab" class="tab-content">
                <div class="form-group">
                    <label class="form-label">Link Zalo</label>
                    <input type="url" id="zaloLink" class="form-input" placeholder="https://zalo.me/0396558306">
                </div>

                <div class="form-group">
                    <label class="form-label">Username Facebook</label>
                    <input type="text" id="facebookUsername" class="form-input" placeholder="tranductien2006">
                </div>

                <div class="form-group">
                    <label class="form-label">Link Facebook</label>
                    <input type="url" id="facebookLink" class="form-input" placeholder="https://facebook.com/tranductien2006">
                </div>
            </div>

            <!-- Tab: Profile Image -->
            <div id="imageTab" class="tab-content">
                <div class="form-group">
                    <label class="form-label">URL Ảnh đại diện</label>
                    <input type="url" id="profileImage" class="form-input" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label class="form-label">Hoặc tải ảnh lên</label>
                    <label for="imageFile" class="file-picker">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Chọn ảnh từ thiết bị</span>
                    </label>
                    <input type="file" id="imageFile" class="file-input" accept="image/*" onchange="previewImage()">
                    <p id="uploadStatus" style="font-size: 12px; color: #6b7280; margin-top: 8px; line-height: 1.5;">
                        <i class="fas fa-cloud-upload-alt mr-1"></i>Sẵn sàng tải ảnh
                    </p>
                </div>
            </div>

            <!-- Tab: Theme -->
            <div id="themeTab" class="tab-content">
                <div class="form-group">
                    <label class="form-label">Chọn giao diện danh thiếp</label>
                    <div class="theme-options">
                        <label class="theme-option" data-theme-option="professional">
                            <input type="radio" name="theme" value="professional" onchange="selectTheme('professional')">
                            <span class="theme-swatch professional"></span>
                            <span><strong>Professional</strong><br><small>Đen / trắng lịch lãm</small></span>
                        </label>
                        <label class="theme-option" data-theme-option="creative">
                            <input type="radio" name="theme" value="creative" onchange="selectTheme('creative')">
                            <span class="theme-swatch creative"></span>
                            <span><strong>Creative</strong><br><small>Hồng cam năng động</small></span>
                        </label>
                        <label class="theme-option" data-theme-option="ocean">
                            <input type="radio" name="theme" value="ocean" onchange="selectTheme('ocean')">
                            <span class="theme-swatch ocean"></span>
                            <span><strong>Ocean</strong><br><small>Xanh cyan hiện đại</small></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button onclick="updateProfile()" class="btn btn-primary">
                    <i class="fas fa-save mr-2"></i>Cập nhật
                </button>

                <button onclick="logout()" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt mr-2"></i>Đăng xuất
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="card" style="display: none;">
            <div class="loading">
                <i class="fas fa-spinner fa-spin mr-2"></i>Đang tải...
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
  apiKey: "AIzaSyAX6cmCWfXuK-OoCJ3aSrFsBd6t06sI-o4",
  authDomain: "digital-business-card-2c74c.firebaseapp.com",
  databaseURL: "https://digital-business-card-2c74c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "digital-business-card-2c74c",
  storageBucket: "digital-business-card-2c74c.firebasestorage.app",
  messagingSenderId: "191265792223",
  appId: "1:191265792223:web:4e06d233088dc13cdf096a",
  measurementId: "G-T8HZX7PT5Q"
};

        // Initialize Firebase (compat SDK is loaded above)
        let auth;
        let database;
        let imageUploadInProgress = false;

        // Cloudinary Free unsigned upload configuration.
        // Replace these two values with your Cloudinary Cloud name and unsigned upload preset.
        const CLOUDINARY_CLOUD_NAME = 'mctx3lwi';
        const CLOUDINARY_UPLOAD_PRESET = 'digital-card-images';
        try {
            if (!window.firebase || typeof firebase.initializeApp !== 'function') {
                throw new Error('Firebase SDK chưa tải được. Hãy kiểm tra kết nối mạng hoặc CDN.');
            }
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            database = firebase.database();
        } catch (error) {
            showFirebaseConfigError(error.message);
        }

        function showFirebaseConfigError(message) {
            const element = document.getElementById('firebaseConfigError');
            if (!element) return;
            const hasPlaceholder = Object.values(firebaseConfig).some(value => String(value).includes('YOUR_'));
            element.innerHTML = `<strong>Không thể kết nối Firebase.</strong><br>${hasPlaceholder ? 'Bạn chưa thay Firebase Config mẫu bằng thông tin thật trong Firebase Console.' : message}<br><small>Mở Console trình duyệt (F12) để xem chi tiết.</small>`;
            element.style.display = 'block';
        }

        // Check authentication state
        if (auth) auth.onAuthStateChanged((user) => {
            if (user) {
                // User is logged in
                if (user.email === 'hierductien@gmail.com') {
                    document.getElementById('authForm').style.display = 'none';           
                    document.getElementById('signupForm').style.display = 'none';          
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('userEmail').textContent = user.email;
            loadProfileData();
                } else {
                    auth.signOut();
                    alert('Bạn không có quyền truy cập trang quản trị này!');
                }
            } else {
                // User is logged out
                document.getElementById('authForm').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        });

        // Login function
        function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('errorMessage', 'Vui lòng nhập email và mật khẩu');
                return;
            }

            if (!auth) { showFirebaseConfigError('Firebase chưa được khởi tạo.'); return; }

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    showError('errorMessage', error.message);
                });
        }

        // Signup function
        function signup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!email || !password) {
                showError('signupError', 'Vui lòng nhập email và mật khẩu');
                return;
            }

            if (password.length < 6) {
                showError('signupError', 'Mật khẩu phải có ít nhất 6 ký tự');
                return;
            }

            if (!auth) { showFirebaseConfigError('Firebase chưa được khởi tạo.'); return; }

            auth.createUserWithEmailAndPassword(email, password)
                .then(() => {
                    showLogin();
                    showError('errorMessage', 'Đăng ký thành công! Vui lòng đăng nhập');
                })
                .catch((error) => {
                    showError('signupError', error.message);
                });
        }

        // Logout function
        function logout() {
            if (!auth) return;
            auth.signOut().then(() => {
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
            });
        }

        const VALID_THEMES = ['professional', 'creative', 'ocean'];
        let selectedTheme = localStorage.getItem('cardTheme') || 'professional';

        function applyAdminTheme(theme) {
            selectedTheme = VALID_THEMES.includes(theme) ? theme : 'professional';
            document.body.classList.remove(...VALID_THEMES.map(name => `theme-${name}`));
            if (selectedTheme !== 'professional') document.body.classList.add(`theme-${selectedTheme}`);
            localStorage.setItem('cardTheme', selectedTheme);
            document.querySelectorAll('[data-theme-option]').forEach(option => option.classList.toggle('selected', option.dataset.themeOption === selectedTheme));
            const radio = document.querySelector(`input[name="theme"][value="${selectedTheme}"]`);
            if (radio) radio.checked = true;
        }

        function selectTheme(theme) {
            applyAdminTheme(theme);
        }

        applyAdminTheme(selectedTheme);

        // Load profile data
        function loadProfileData() {
            database.ref('profile').once('value', (snapshot) => {
                const data = snapshot.val() || {};
                
                // Populate form fields
                document.getElementById('fullName').value = data.name || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('zaloName').value = data.zaloName || '';
                document.getElementById('zaloLink').value = data.zaloLink || '';
                document.getElementById('facebookUsername').value = data.facebookUsername || '';
                document.getElementById('facebookLink').value = data.facebookLink || '';
                const storedImageUrl = /^https?:\/\//i.test(data.profileImage || '') ? data.profileImage : '';
                document.getElementById('profileImage').value = storedImageUrl;
                applyAdminTheme(data.theme || selectedTheme);

                // Update preview
                updatePreview(data);
            });
        }

        // Update profile
        function updateProfile() {
            if (!database) {
                showFirebaseConfigError('Firebase chưa được khởi tạo.');
                return;
            }
            if (imageUploadInProgress) {
                showError('adminError', 'Ảnh đang được tải lên. Vui lòng chờ tải xong rồi bấm cập nhật.');
                return;
            }
            const profileData = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                zaloName: document.getElementById('zaloName').value,
                zaloLink: document.getElementById('zaloLink').value,
                facebookUsername: document.getElementById('facebookUsername').value,
                facebookLink: document.getElementById('facebookLink').value,
                profileImage: document.getElementById('profileImage').value,
                theme: selectedTheme
            };

            database.ref('profile').set(profileData)
                .then(() => {
                    showSuccess('successMessage');
                    updatePreview(profileData);
                })
                .catch((error) => {
                    showError('adminError', error.message);
                });
        }

        // Update preview
        function updatePreview(data) {
            document.getElementById('previewName').textContent = data.name || 'Tên của bạn';
            document.getElementById('previewPhone').textContent = data.phone || '';

            if (data.profileImage) {
                document.getElementById('previewImg').src = data.profileImage;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('previewIcon').style.display = 'none';
            } else {
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('previewIcon').style.display = 'block';
            }
        }

        // Preview locally, then upload the selected image to Firebase Storage.
        function previewImage() {
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];
            if (!file) return;

            if (!file.type || !file.type.startsWith('image/')) {
                fileInput.value = '';
                setUploadStatus('File đã chọn không phải là ảnh hợp lệ.', true);
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                fileInput.value = '';
                setUploadStatus('Ảnh không được lớn hơn 5MB.', true);
                return;
            }

            const previewUrl = URL.createObjectURL(file);
            const preview = document.getElementById('previewImg');
            preview.onload = () => URL.revokeObjectURL(previewUrl);
            preview.src = previewUrl;
            preview.style.display = 'block';
            document.getElementById('previewIcon').style.display = 'none';
            uploadProfileImage(file);
        }

        function setUploadStatus(message, isError = false) {
            const status = document.getElementById('uploadStatus');
            if (!status) return;
            status.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-cloud-upload-alt'} mr-1"></i>${message}`;
            status.style.color = isError ? '#dc2626' : '#6b7280';
        }

        function uploadProfileImage(file) {
            if (!auth || !auth.currentUser) {
                setUploadStatus('Bạn cần đăng nhập Admin trước khi tải ảnh.', true);
                return;
            }
            if (CLOUDINARY_CLOUD_NAME.includes('YOUR_') || CLOUDINARY_UPLOAD_PRESET.includes('YOUR_')) {
                setUploadStatus('Chưa cấu hình Cloudinary. Hãy điền CLOUD_NAME và UPLOAD_PRESET trong mã Admin.', true);
                return;
            }

            imageUploadInProgress = true;
            setUploadStatus('Đang tải ảnh lên Cloudinary... 0%');
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/image/upload`);
            xhr.upload.addEventListener('progress', (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    setUploadStatus(`Đang tải ảnh lên Cloudinary... ${percent}%`);
                }
            });
            xhr.onload = () => {
                imageUploadInProgress = false;
                let result = {};
                try { result = JSON.parse(xhr.responseText || '{}'); } catch (error) {}
                if (xhr.status >= 200 && xhr.status < 300 && result.secure_url) {
                    document.getElementById('profileImage').value = result.secure_url;
                    setUploadStatus('Đã tải ảnh thành công. Bấm “Cập nhật thông tin” để lưu.');
                } else {
                    setUploadStatus(`Cloudinary từ chối ảnh: ${result.error?.message || `HTTP ${xhr.status}`}`, true);
                }
            };
            xhr.onerror = () => {
                imageUploadInProgress = false;
                setUploadStatus('Không kết nối được Cloudinary. Kiểm tra mạng hoặc cấu hình upload preset.', true);
            };
            xhr.send(formData);
        }

        // Tab switching
        function switchTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            // Show selected tab
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        // Show/Hide forms
        function showSignup() {
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('authForm').style.display = 'block';
        }

        // Show error message
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // Show success message
        function showSuccess(elementId) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }

        // Allow Enter key for login
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('authForm').style.display !== 'none') {
                    login();
                } else if (document.getElementById('signupForm').style.display !== 'none') {
                    signup();
                }
            }
        });
    </script>
</body>
</html>
