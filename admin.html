<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Digital Business Card</title>
    <link rel="stylesheet" href="assets/fontawesome.min.css">
    <link rel="stylesheet" href="assets/inter.css">
    <!-- Firebase SDK -->
    <script src="assets/firebase-app-compat.js"></script>
    <script src="assets/firebase-database-compat.js"></script>
    <script src="assets/firebase-auth-compat.js"></script>
    <!-- Chế độ sáng/tối: nạp sớm để không bị nháy màu -->
    <script src="assets/ui-mode.js"></script>
    <!-- Chủ đề màu: nạp sớm, cùng lý do -->
    <script src="assets/ui-theme.js"></script>
    <!-- Phong cách Ultimate UI 3-in-1 (Neo-Glass + Floating Label + Liquid Gradient) -->
    <link rel="stylesheet" href="assets/ultimate-ui.css">
    <style>
        /* Bố cục riêng của trang admin. Màu sắc/hiệu ứng lõi nằm trong assets/ultimate-ui.css */
        .admin-shell {
            width: min(100%, 720px); max-width: 100%; min-width: 0;
            display: grid; grid-template-columns: minmax(0, 1fr);   /* không để nội dung đẩy rộng quá màn hình */
            justify-items: center; gap: 16px;
        }
        .admin-shell > .ui-container { max-width: 100%; min-width: 0; }
        .tabs { min-width: 0; max-width: 100%; }
        .admin-shell > .error-message { width: min(100%, 420px); }
        .admin-panel { display: none; }              /* JS bật bằng style.display = 'block' */

        .ui-title i { margin-right: 8px; color: var(--ui-glow); }
        .ui-btn i { margin-right: 8px; }
        .ui-subtitle.header-sub { margin-bottom: 28px; }
        .switch-line { margin: 22px 0 0; text-align: center; }
        .ui-btn--danger { color: var(--ui-danger); border-color: color-mix(in srgb, var(--ui-danger) 45%, transparent); }
        .ui-btn--danger:hover {
            background: var(--ui-danger); color: var(--ui-on-glow); border-color: transparent;
            box-shadow: 0 0 20px color-mix(in srgb, var(--ui-danger) 55%, transparent);
        }
        button.ui-btn--danger:hover { background: var(--ui-danger); }

        /* Thông báo (JS bật/tắt bằng style.display) */
        .error-message, .success-message {
            display: none; margin-bottom: 20px; padding: 12px 14px; font-size: 14px;
            border-radius: var(--ui-radius-ctl);
        }
        .error-message {
            color: var(--ui-danger);
            border: 1px solid color-mix(in srgb, var(--ui-danger) 45%, transparent);
            background: color-mix(in srgb, var(--ui-danger) 10%, var(--ui-popover-bg));
        }
        .success-message {
            color: var(--ui-success);
            border: 1px solid color-mix(in srgb, var(--ui-success) 40%, transparent);
            background: color-mix(in srgb, var(--ui-success) 10%, transparent);
        }
        .loading { text-align: center; color: var(--ui-text-sub); }

        /* Đầu panel + xem trước hồ sơ */
        #userEmail { color: var(--ui-glow); font-weight: 600; }
        .profile-preview {
            display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding: 14px 16px;
            border-radius: 16px;
            background: var(--ui-surface);
            border: 1px solid var(--ui-border);
        }
        .profile-preview img {
            flex: 0 0 76px; width: 76px; height: 76px; border-radius: 50%; object-fit: cover; margin: 0;
            border: 3px solid rgb(var(--ui-glow-rgb) / .65);
            box-shadow: 0 0 0 5px rgb(var(--ui-glow-rgb) / .12), 0 10px 24px -8px rgb(var(--ui-glow-rgb) / .45);
        }
        .profile-preview > i { flex: 0 0 76px; width: 76px; text-align: center; font-size: 48px; color: var(--ui-text-sub); }
        .preview-details { min-width: 0; text-align: left; }
        .profile-preview p { margin: 3px 0 0; font-size: 14px; color: var(--ui-text-sub); overflow-wrap: anywhere; }
        .profile-preview #previewName { margin-top: 0; font-size: 16px; font-weight: 700; color: var(--ui-text); }
        .profile-preview #previewPhone { font-size: 13px; }

        /* Tab: gạch chân sáng theo màu theme */
        .tabs {
            min-width: 0; display: flex; gap: 6px; margin-bottom: 30px; overflow-x: auto;
            border-bottom: 2px solid var(--ui-line);
            overscroll-behavior-x: contain; scrollbar-width: thin; -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            flex: 0 0 auto; min-width: 96px; padding: 11px 12px; margin-bottom: -2px;
            font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
            color: var(--ui-text-sub); background: none; border: none; border-bottom: 3px solid transparent;
            transition: color .3s ease, border-color .3s ease, text-shadow .3s ease;
        }
        .tab-btn i { margin-right: 6px; pointer-events: none; }   /* click vào icon vẫn tính là click nút */
        .tab-btn:hover { color: var(--ui-text); }
        .tab-btn.active { color: var(--ui-glow); border-bottom-color: var(--ui-glow); text-shadow: 0 0 14px rgb(var(--ui-glow-rgb) / .5); }
        .tab-btn:focus-visible { outline: 2px solid var(--ui-glow); outline-offset: -2px; border-radius: 6px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Tải ảnh */
        .field-caption { margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--ui-text-sub); }
        .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        .file-picker {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; min-height: 46px; padding: 11px 14px; box-sizing: border-box;
            font-size: 14px; font-weight: 700; color: var(--ui-glow); cursor: pointer;
            border: 1px dashed rgb(var(--ui-glow-rgb) / .55); border-radius: var(--ui-radius-ctl);
            background: rgb(var(--ui-glow-rgb) / .08);
            transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        .file-picker:hover { background: rgb(var(--ui-glow-rgb) / .16); border-style: solid; box-shadow: 0 0 18px rgb(var(--ui-glow-rgb) / .3); }
        .file-picker:active { transform: scale(.99); }
        .upload-status { margin: 10px 0 0; font-size: 12px; line-height: 1.5; color: var(--ui-text-sub); }
        .upload-status i { margin-right: 4px; }

        /* Chọn giao diện: swatch giữ đúng màu preset của từng theme */
        .theme-options { display: grid; gap: 12px; }
        .theme-option {
            display: flex; align-items: center; gap: 12px; padding: 14px; cursor: pointer;
            border: 1px solid var(--ui-border); border-radius: 16px;
            background: var(--ui-surface);
            transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
        }
        .theme-option input { accent-color: var(--ui-glow); }
        .theme-option small { color: var(--ui-text-sub); text-wrap: balance; }   /* tránh ngắt chữ lẻ ở dòng cuối */
        .theme-option:hover { border-color: rgb(var(--ui-glow-rgb) / .45); }
        .theme-option.selected {
            border-color: var(--ui-glow); background: rgb(var(--ui-glow-rgb) / .10);
            box-shadow: 0 0 20px -4px rgb(var(--ui-glow-rgb) / .45);
        }
        .theme-swatch { width: 42px; height: 42px; border-radius: 10px; flex: 0 0 auto; }
        .theme-swatch.nordic    { background: linear-gradient(135deg, rgb(56 189 248), rgb(2 132 199)); }
        .theme-swatch.champagne { background: linear-gradient(135deg, rgb(245 158 11), rgb(180 83 9)); }
        .theme-swatch.emerald   { background: linear-gradient(135deg, rgb(16 185 129), rgb(4 120 87)); }
        .theme-swatch.indigo    { background: linear-gradient(135deg, rgb(129 140 248), rgb(79 70 229)); }

        /* Thanh hành động */
        .action-buttons { display: grid; grid-template-columns: minmax(0, 2.5fr) minmax(0, 1fr); gap: 10px; margin-top: 22px; }   /* Cập nhật : Đăng xuất = 2.5 : 1 */
        .action-buttons .ui-btn { margin: 0; padding-inline: 10px; white-space: nowrap; }
        @media (min-width: 641px) {
            .action-buttons {
                position: sticky; bottom: 16px; z-index: 5; padding-top: 14px;
                background: linear-gradient(to top, color-mix(in srgb, var(--ui-bg-1) 70%, transparent), transparent);
            }
        }

        @media (max-width: 640px) {
            .ui-card { padding: 28px 18px; }
            .ui-title { font-size: clamp(22px, 7vw, 26px); line-height: 1.25; }
            .profile-preview { gap: 12px; margin-bottom: 18px; padding: 12px; }
            .profile-preview img, .profile-preview > i { flex-basis: 64px; width: 64px; height: 64px; }
            .profile-preview > i { font-size: 34px; line-height: 64px; }
            .profile-preview #previewName { font-size: 15px; }
            .profile-preview #previewPhone { font-size: 12px; }
            .tabs { margin: 0 0 26px; }
            .tab-btn { flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 9px 6px; font-size: 12px; }
            .tab-btn i { display: none; }               /* nhường chỗ để cả 4 tab hiện đủ */
            .theme-option { min-width: 0; padding: 12px 10px; }
            .action-buttons { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px; margin-top: 18px; }   /* 2 : 1 */
            .action-buttons .ui-btn { padding: 11px 6px; font-size: 13px; }
            .action-buttons .ui-btn i { margin-right: 6px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .tab-btn, .file-picker, .theme-option { transition: none; }
        }
    </style>
</head>
<body class="ui-page ui-page--topbar">
    <!-- Góc phải: sáng/tối (logic ở assets/ui-mode.js, dùng chung với index.html) -->
    <div class="ui-topbar">
        <button type="button" class="ui-mode-toggle" data-mode-toggle aria-pressed="true" title="Chuyển sang giao diện sáng" aria-label="Chuyển sang giao diện sáng">
            <i class="fas fa-sun" aria-hidden="true"></i>
            <i class="fas fa-moon" aria-hidden="true"></i>
        </button>
    </div>

    <div class="admin-shell">
        <div id="firebaseConfigError" class="error-message" style="display: none;"></div>

        <!-- Đăng nhập -->
        <div id="authForm" class="ui-container">
            <div class="ui-card">
                <h1 class="ui-title"><i class="fas fa-lock"></i>Đăng nhập Admin</h1>
                <p class="ui-subtitle">Quản lý thông tin danh thiếp của bạn</p>

                <div id="errorMessage" class="error-message"></div>

                <div class="ui-field">
                    <input type="email" id="loginEmail" class="ui-input" placeholder=" " autocomplete="username">
                    <label for="loginEmail" class="ui-label">Email</label>
                </div>
                <div class="ui-field">
                    <input type="password" id="loginPassword" class="ui-input" placeholder=" " autocomplete="current-password">
                    <label for="loginPassword" class="ui-label">Mật khẩu</label>
                </div>

                <button type="button" onclick="login()" class="ui-btn">
                    <i class="fas fa-sign-in-alt"></i>Đăng nhập
                </button>

                <p class="ui-subtitle switch-line">Chưa có tài khoản? <a href="#" class="ui-link" onclick="showSignup()">Đăng ký tại đây</a></p>
            </div>
        </div>

        <!-- Đăng ký -->
        <div id="signupForm" class="ui-container" style="display: none;">
            <div class="ui-card">
                <h1 class="ui-title"><i class="fas fa-user-plus"></i>Tạo tài khoản Admin</h1>
                <p class="ui-subtitle">Đăng ký để quản lý danh thiếp</p>

                <div id="signupError" class="error-message"></div>

                <div class="ui-field">
                    <input type="email" id="signupEmail" class="ui-input" placeholder=" " autocomplete="username">
                    <label for="signupEmail" class="ui-label">Email</label>
                </div>
                <div class="ui-field">
                    <input type="password" id="signupPassword" class="ui-input" placeholder=" " autocomplete="new-password">
                    <label for="signupPassword" class="ui-label">Mật khẩu (tối thiểu 6 ký tự)</label>
                </div>

                <button type="button" onclick="signup()" class="ui-btn">
                    <i class="fas fa-user-plus"></i>Đăng ký
                </button>
                <button type="button" onclick="showLogin()" class="ui-btn ui-btn--ghost">
                    <i class="fas fa-arrow-left"></i>Quay lại Đăng nhập
                </button>
            </div>
        </div>

        <!-- Bảng quản trị -->
        <div id="adminPanel" class="ui-container ui-container--wide admin-panel">
            <div class="ui-card">
                <h1 class="ui-title"><i class="fas fa-cog"></i>Quản lý Danh thiếp</h1>
                <p id="userEmail" class="ui-subtitle header-sub"></p>

                <div id="successMessage" class="success-message">
                    <i class="fas fa-check-circle" style="margin-right: 8px;"></i>Cập nhật thành công!
                </div>

                <div id="adminError" class="error-message"></div>

                <!-- Xem trước hồ sơ -->
                <div class="profile-preview">
                    <img id="previewImg" src="" alt="Ảnh đại diện xem trước" loading="lazy" decoding="async" style="display: none;">
                    <i id="previewIcon" class="fas fa-user"></i>
                    <div class="preview-details">
                        <p id="previewName">Tên của bạn</p>
                        <p id="previewPhone"></p>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs">
                    <button type="button" class="tab-btn active" onclick="switchTab('personal', this)">
                        <i class="fas fa-user"></i>Thông tin
                    </button>
                    <button type="button" class="tab-btn" onclick="switchTab('social', this)">
                        <i class="fas fa-share-alt"></i>Mạng xã hội
                    </button>
                    <button type="button" class="tab-btn" onclick="switchTab('image', this)">
                        <i class="fas fa-image"></i>Ảnh đại diện
                    </button>
                    <button type="button" class="tab-btn" onclick="switchTab('theme', this)">
                        <i class="fas fa-palette"></i>Giao diện
                    </button>
                </div>

                <!-- Tab: Thông tin cá nhân -->
                <div id="personalTab" class="tab-content active">
                    <div class="ui-field">
                        <input type="text" id="fullName" class="ui-input" placeholder=" " autocomplete="name">
                        <label for="fullName" class="ui-label">Họ và tên</label>
                    </div>
                    <div class="ui-field">
                        <input type="tel" id="phone" class="ui-input" placeholder=" " autocomplete="tel">
                        <label for="phone" class="ui-label">Số điện thoại</label>
                    </div>
                    <div class="ui-field">
                        <input type="email" id="email" class="ui-input" placeholder=" " autocomplete="email">
                        <label for="email" class="ui-label">Email</label>
                    </div>
                    <div class="ui-field">
                        <input type="text" id="zaloName" class="ui-input" placeholder=" ">
                        <label for="zaloName" class="ui-label">Tên Zalo</label>
                    </div>
                </div>

                <!-- Tab: Mạng xã hội -->
                <div id="socialTab" class="tab-content">
                    <div class="ui-field">
                        <input type="url" id="zaloLink" class="ui-input" placeholder=" ">
                        <label for="zaloLink" class="ui-label">Link Zalo</label>
                    </div>
                    <div class="ui-field">
                        <input type="text" id="facebookUsername" class="ui-input" placeholder=" ">
                        <label for="facebookUsername" class="ui-label">Username Facebook</label>
                    </div>
                    <div class="ui-field">
                        <input type="url" id="facebookLink" class="ui-input" placeholder=" ">
                        <label for="facebookLink" class="ui-label">Link Facebook</label>
                    </div>
                </div>

                <!-- Tab: Ảnh đại diện -->
                <div id="imageTab" class="tab-content">
                    <div class="ui-field">
                        <input type="url" id="profileImage" class="ui-input" placeholder=" ">
                        <label for="profileImage" class="ui-label">URL Ảnh đại diện</label>
                    </div>

                    <p class="field-caption">Hoặc tải ảnh lên</p>
                    <label for="imageFile" class="file-picker">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Chọn ảnh từ thiết bị</span>
                    </label>
                    <input type="file" id="imageFile" class="file-input" accept="image/*" onchange="previewImage()">
                    <p id="uploadStatus" class="upload-status">
                        <i class="fas fa-cloud-upload-alt"></i>Sẵn sàng tải ảnh
                    </p>
                </div>

                <!-- Tab: Giao diện danh thiếp -->
                <div id="themeTab" class="tab-content">
                    <p class="field-caption">Chọn giao diện danh thiếp</p>
                    <div class="theme-options">
                        <label class="theme-option" data-theme-option="nordic">
                            <input type="radio" name="theme" value="nordic" onchange="selectTheme('nordic')">
                            <span class="theme-swatch nordic"></span>
                            <span><strong>Nordic Cobalt</strong><br><small>Xanh thép Bắc Âu · chuẩn mực, tinh tế</small></span>
                        </label>
                        <label class="theme-option" data-theme-option="champagne">
                            <input type="radio" name="theme" value="champagne" onchange="selectTheme('champagne')">
                            <span class="theme-swatch champagne"></span>
                            <span><strong>Obsidian &amp; Champagne</strong><br><small>Vàng champagne &amp; than chì · sang trọng</small></span>
                        </label>
                        <label class="theme-option" data-theme-option="emerald">
                            <input type="radio" name="theme" value="emerald" onchange="selectTheme('emerald')">
                            <span class="theme-swatch emerald"></span>
                            <span><strong>Emerald Graphite</strong><br><small>Xanh ngọc lục bảo &amp; xám khói · hiện đại</small></span>
                        </label>
                        <label class="theme-option" data-theme-option="indigo">
                            <input type="radio" name="theme" value="indigo" onchange="selectTheme('indigo')">
                            <span class="theme-swatch indigo"></span>
                            <span><strong>Royal Indigo &amp; Pearl</strong><br><small>Tím chàm &amp; trắng ngọc trai · sáng tạo</small></span>
                        </label>
                    </div>
                </div>

                <!-- Hành động -->
                <div class="action-buttons">
                    <button type="button" onclick="updateProfile()" class="ui-btn">
                        <i class="fas fa-save"></i>Cập nhật
                    </button>
                    <button type="button" onclick="logout()" class="ui-btn ui-btn--ghost ui-btn--danger">
                        <i class="fas fa-sign-out-alt"></i>Đăng xuất
                    </button>
                </div>
            </div>
        </div>

        <!-- Đang tải -->
        <div id="loading" style="display: none;">
            <div class="ui-card ui-card--flat loading">
                <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i>Đang tải...
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
  apiKey: "AIzaSyAX6cmCWfXuK-OoCJ3aSrFsBd6t06sI-o4",
  authDomain: "digital-business-card-2c74c.firebaseapp.com",
  databaseURL: "https://digital-business-card-2c74c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "digital-business-card-2c74c",
  storageBucket: "digital-business-card-2c74c.firebasestorage.app",
  messagingSenderId: "191265792223",
  appId: "1:191265792223:web:4e06d233088dc13cdf096a",
  measurementId: "G-T8HZX7PT5Q"
};

        // Initialize Firebase (compat SDK is loaded above)
        let auth;
        let database;
        let imageUploadInProgress = false;

        // Cloudinary Free unsigned upload configuration.
        // Replace these two values with your Cloudinary Cloud name and unsigned upload preset.
        const CLOUDINARY_CLOUD_NAME = 'mctx3lwi';
        const CLOUDINARY_UPLOAD_PRESET = 'digital-card-images';
        try {
            if (!window.firebase || typeof firebase.initializeApp !== 'function') {
                throw new Error('Firebase SDK chưa tải được. Hãy kiểm tra kết nối mạng hoặc CDN.');
            }
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            database = firebase.database();
        } catch (error) {
            showFirebaseConfigError(error.message);
        }

        function showFirebaseConfigError(message) {
            const element = document.getElementById('firebaseConfigError');
            if (!element) return;
            const hasPlaceholder = Object.values(firebaseConfig).some(value => String(value).includes('YOUR_'));
            element.innerHTML = `<strong>Không thể kết nối Firebase.</strong><br>${hasPlaceholder ? 'Bạn chưa thay Firebase Config mẫu bằng thông tin thật trong Firebase Console.' : message}<br><small>Mở Console trình duyệt (F12) để xem chi tiết.</small>`;
            element.style.display = 'block';
        }

        // Check authentication state
        if (auth) auth.onAuthStateChanged((user) => {
            if (user) {
                // User is logged in
                if (user.email === 'hierductien@gmail.com') {
                    document.getElementById('authForm').style.display = 'none';           
                    document.getElementById('signupForm').style.display = 'none';          
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('userEmail').textContent = user.email;
            loadProfileData();
                } else {
                    auth.signOut();
                    alert('Bạn không có quyền truy cập trang quản trị này!');
                }
            } else {
                // User is logged out
                document.getElementById('authForm').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
            }
        });

        // Login function
        function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('errorMessage', 'Vui lòng nhập email và mật khẩu');
                return;
            }

            if (!auth) { showFirebaseConfigError('Firebase chưa được khởi tạo.'); return; }

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    showError('errorMessage', error.message);
                });
        }

        // Signup function
        function signup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!email || !password) {
                showError('signupError', 'Vui lòng nhập email và mật khẩu');
                return;
            }

            if (password.length < 6) {
                showError('signupError', 'Mật khẩu phải có ít nhất 6 ký tự');
                return;
            }

            if (!auth) { showFirebaseConfigError('Firebase chưa được khởi tạo.'); return; }

            auth.createUserWithEmailAndPassword(email, password)
                .then(() => {
                    showLogin();
                    showError('errorMessage', 'Đăng ký thành công! Vui lòng đăng nhập');
                })
                .catch((error) => {
                    showError('signupError', error.message);
                });
        }

        // Logout function
        function logout() {
            if (!auth) return;
            auth.signOut().then(() => {
                document.getElementById('loginEmail').value = '';
                document.getElementById('loginPassword').value = '';
            });
        }

        let selectedTheme = UITheme.saved();

        function applyAdminTheme(theme) {
            selectedTheme = UITheme.apply(theme);   // đổi màu ngay (xem trước) + chuẩn hoá tên chủ đề cũ
            document.querySelectorAll('[data-theme-option]').forEach(option => option.classList.toggle('selected', option.dataset.themeOption === selectedTheme));
            const radio = document.querySelector(`input[name="theme"][value="${selectedTheme}"]`);
            if (radio) radio.checked = true;
        }

        function selectTheme(theme) {
            applyAdminTheme(theme);
        }

        applyAdminTheme(selectedTheme);

        // Load profile data
        function loadProfileData() {
            database.ref('profile').once('value', (snapshot) => {
                const data = snapshot.val() || {};
                
                // Populate form fields
                document.getElementById('fullName').value = data.name || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('zaloName').value = data.zaloName || '';
                document.getElementById('zaloLink').value = data.zaloLink || '';
                document.getElementById('facebookUsername').value = data.facebookUsername || '';
                document.getElementById('facebookLink').value = data.facebookLink || '';
                const storedImageUrl = /^https?:\/\//i.test(data.profileImage || '') ? data.profileImage : '';
                document.getElementById('profileImage').value = storedImageUrl;
                applyAdminTheme(data.theme || selectedTheme);

                // Update preview
                updatePreview(data);
            });
        }

        // Update profile
        function updateProfile() {
            if (!database) {
                showFirebaseConfigError('Firebase chưa được khởi tạo.');
                return;
            }
            if (imageUploadInProgress) {
                showError('adminError', 'Ảnh đang được tải lên. Vui lòng chờ tải xong rồi bấm cập nhật.');
                return;
            }
            const profileData = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                zaloName: document.getElementById('zaloName').value,
                zaloLink: document.getElementById('zaloLink').value,
                facebookUsername: document.getElementById('facebookUsername').value,
                facebookLink: document.getElementById('facebookLink').value,
                profileImage: document.getElementById('profileImage').value,
                theme: selectedTheme
            };

            database.ref('profile').set(profileData)
                .then(() => {
                    showSuccess('successMessage');
                    updatePreview(profileData);
                })
                .catch((error) => {
                    showError('adminError', error.message);
                });
        }

        // Update preview
        function updatePreview(data) {
            document.getElementById('previewName').textContent = data.name || 'Tên của bạn';
            document.getElementById('previewPhone').textContent = data.phone || '';

            if (data.profileImage) {
                document.getElementById('previewImg').src = data.profileImage;
                document.getElementById('previewImg').style.display = 'block';
                document.getElementById('previewIcon').style.display = 'none';
            } else {
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('previewIcon').style.display = 'block';
            }
        }

        // Preview locally, then upload the selected image to Firebase Storage.
        function previewImage() {
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];
            if (!file) return;

            if (!file.type || !file.type.startsWith('image/')) {
                fileInput.value = '';
                setUploadStatus('File đã chọn không phải là ảnh hợp lệ.', true);
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                fileInput.value = '';
                setUploadStatus('Ảnh không được lớn hơn 5MB.', true);
                return;
            }

            const previewUrl = URL.createObjectURL(file);
            const preview = document.getElementById('previewImg');
            preview.onload = () => URL.revokeObjectURL(previewUrl);
            preview.src = previewUrl;
            preview.style.display = 'block';
            document.getElementById('previewIcon').style.display = 'none';
            uploadProfileImage(file);
        }

        function setUploadStatus(message, isError = false) {
            const status = document.getElementById('uploadStatus');
            if (!status) return;
            status.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-cloud-upload-alt'} mr-1"></i>${message}`;
            status.style.color = isError ? 'var(--ui-danger)' : 'var(--ui-text-sub)';
        }

        function uploadProfileImage(file) {
            if (!auth || !auth.currentUser) {
                setUploadStatus('Bạn cần đăng nhập Admin trước khi tải ảnh.', true);
                return;
            }
            if (CLOUDINARY_CLOUD_NAME.includes('YOUR_') || CLOUDINARY_UPLOAD_PRESET.includes('YOUR_')) {
                setUploadStatus('Chưa cấu hình Cloudinary. Hãy điền CLOUD_NAME và UPLOAD_PRESET trong mã Admin.', true);
                return;
            }

            imageUploadInProgress = true;
            setUploadStatus('Đang tải ảnh lên Cloudinary... 0%');
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${encodeURIComponent(CLOUDINARY_CLOUD_NAME)}/image/upload`);
            xhr.upload.addEventListener('progress', (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    setUploadStatus(`Đang tải ảnh lên Cloudinary... ${percent}%`);
                }
            });
            xhr.onload = () => {
                imageUploadInProgress = false;
                let result = {};
                try { result = JSON.parse(xhr.responseText || '{}'); } catch (error) {}
                if (xhr.status >= 200 && xhr.status < 300 && result.secure_url) {
                    document.getElementById('profileImage').value = result.secure_url;
                    setUploadStatus('Đã tải ảnh thành công. Bấm “Cập nhật” để lưu.');
                } else {
                    setUploadStatus(`Cloudinary từ chối ảnh: ${result.error?.message || `HTTP ${xhr.status}`}`, true);
                }
            };
            xhr.onerror = () => {
                imageUploadInProgress = false;
                setUploadStatus('Không kết nối được Cloudinary. Kiểm tra mạng hoặc cấu hình upload preset.', true);
            };
            xhr.send(formData);
        }

        // Tab switching
        function switchTab(tab, button) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            // Show selected tab
            document.getElementById(tab + 'Tab').classList.add('active');
            button?.classList.add('active');
        }

        // Show/Hide forms
        function showSignup() {
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('signupForm').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('signupForm').style.display = 'none';
            document.getElementById('authForm').style.display = 'block';
        }

        // Show error message
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // Show success message
        function showSuccess(elementId) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 3000);
        }

        // Allow Enter key for login
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.target.closest('button, a')) {
                if (document.getElementById('authForm').style.display !== 'none') {
                    login();
                } else if (document.getElementById('signupForm').style.display !== 'none') {
                    signup();
                }
            }
        });
    </script>
</body>
</html>
